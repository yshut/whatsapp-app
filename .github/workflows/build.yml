name: Build Multi Space

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source files
        run: node tools/check-repository.mjs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and device test APKs
        run: bash ./gradlew :manager:assembleDebug :manager:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-space-debug-${{ github.sha }}
          path: |
            manager/build/outputs/apk/debug/*.apk
            manager/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
