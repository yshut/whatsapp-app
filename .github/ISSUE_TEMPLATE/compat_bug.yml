name: APP 问题反馈
description: 反馈多开空间启动、同步、界面或网络问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: 请勿上传住宅密码、验证码、手机号或聊天内容；日志应先脱敏。
  - type: input
    id: version
    attributes:
      label: 多开空间版本
      placeholder: 0.3.3-test
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与 Android 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 发生时间、空间编号与脱敏后的错误信息
